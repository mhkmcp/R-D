[project]
name = "fidnn"
version = "0.1.0"
description = "Fault injection detection in DNNs using multi-layer internal states and SVDD"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn~=1.7.2",
    "pyyaml>=6",
    "py7zr>=0.22",
    "kaggle>=1.7",
    "torch>=2.11.0",
    "pillow>=12.3.0",
    "torchvision>=0.26.0",
    "gradio>=6.29.1",
]

[project.scripts]
fidnn = "fidnn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
ui = [
    "gradio>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
